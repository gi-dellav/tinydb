[package]
name = "tinydb"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
argon2 = "0.6.0"
base64 = "0.23.1"
dirs = "7.0.0"
rand = "0.10.3"
rcgen = "0.14.10"
rusqlite = { version = "0.40.2", features = ["functions"] }
rustls = "0.23.45"
rustls-pemfile = "2.2.0"
rustls-pki-types = "1.15.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tokio = { version = "1.53.2", features = ["full"] }
tokio-rustls = "0.26.6"
